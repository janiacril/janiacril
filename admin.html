
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración | JANIACRIL</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 25px;
      font-family: Arial, sans-serif;
      background: #f2f7f3;
      color: #24352b;
    }
    .contenedor {
      max-width: 750px;
      margin: 25px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 18px #00000012;
    }
    h1, h2 { color: #246b45; }
    input, textarea, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      font-size: 15px;
    }
    input, textarea {
      border: 1px solid #ccd8ce;
    }
    button {
      border: 0;
      background: #287449;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #1d5937; }
    .secundario { background: #64766a; }
    .eliminar { background: #b83b3b; }
    .producto {
      border: 1px solid #dce7df;
      padding: 14px;
      border-radius: 10px;
      margin: 12px 0;
      display: flex;
      gap: 15px;
      align-items: center;
    }
    .producto img {
      width: 85px;
      height: 85px;
      object-fit: cover;
      border-radius: 8px;
    }
    .producto-info { flex: 1; }
    .producto button { margin-top: 5px; }
    #panel { display: none; }
    #mensaje { font-weight: bold; }
    .oculto { display: none; }
  </style>
</head>
<body>

  <div class="contenedor">
    <h1>JANIACRIL</h1>
    <p>Panel de administración de productos</p>

    <section id="login">
      <h2>Iniciar sesión</h2>
      <input id="correo" type="email" placeholder="Correo electrónico">
      <input id="clave" type="password" placeholder="Contraseña">
      <button id="entrar">Ingresar</button>
      <p id="mensaje"></p>
    </section>

    <section id="panel">
      <button id="salir" class="secundario">Cerrar sesión</button>

      <h2 id="tituloFormulario">Agregar producto</h2>
      <input id="nombre" placeholder="Nombre del producto">
      <input id="categoria" placeholder="Categoría">
      <textarea id="descripcion" placeholder="Descripción del producto"></textarea>

      <label for="foto"><strong>Foto del producto:</strong></label>
      <input id="foto" type="file" accept="image/png,image/jpeg,image/webp">
      <p id="estadoFoto"></p>
      <img id="vistaPrevia" style="display:none;max-width:150px;border-radius:10px;">

      <button id="guardar">Guardar producto</button>
      <button id="cancelar" class="secundario oculto">Cancelar edición</button>
      <p id="mensajePanel"></p>

      <hr>
      <h2>Mis productos</h2>
      <div id="lista"></div>
    </section>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore,
      collection,
      addDoc,
      getDocs,
      updateDoc,
      deleteDoc,
      doc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBGDx598ENGfbUADWOXsdmXe42n1Lf-24",
      authDomain: "janiacril-50a9b.firebaseapp.com",
      projectId: "janiacril-50a9b",
      storageBucket: "janiacril-50a9b.firebasestorage.app",
      messagingSenderId: "213743116298",
      appId: "1:213743116298:web:b3d2055fc470edb55c3ff3",
      measurementId: "G-F5VLPGVRQF"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const ADMIN_UID = "4vCpe7JpzdM6GqP7V1hpcBK530d2";
    const CLOUD_NAME = "llxnor52";
    const UPLOAD_PRESET = "janiacril_productos";

    let imagenActual = "";
    let productoEditando = null;

    const $ = id => document.getElementById(id);

    $("entrar").addEventListener("click", async () => {
      $("mensaje").textContent = "Ingresando...";
      try {
        await signInWithEmailAndPassword(
          auth,
          $("correo").value.trim(),
          $("clave").value
        );
      } catch (error) {
        $("mensaje").textContent = "No se pudo ingresar. Revisa tu correo y contraseña.";
      }
    });

    $("salir").addEventListener("click", () => signOut(auth));

    onAuthStateChanged(auth, user => {
      if (user && user.uid === ADMIN_UID) {
        $("login").style.display = "none";
        $("panel").style.display = "block";
        $("mensaje").textContent = "";
        cargarProductos();
      } else {
        $("panel").style.display = "none";
        $("login").style.display = "block";
        if (user) {
          $("mensaje").textContent = "Esta cuenta no tiene permiso de administración.";
          signOut(auth);
        }
      }
    });

    $("foto").addEventListener("change", () => {
      const archivo = $("foto").files[0];
      if (!archivo) return;

      if (archivo.size > 5 * 1024 * 1024) {
        $("estadoFoto").textContent = "La foto debe pesar menos de 5 MB.";
        $("foto").value = "";
        return;
      }

      $("vistaPrevia").src = URL.createObjectURL(archivo);
      $("vistaPrevia").style.display = "block";
      $("estadoFoto").textContent = "Foto seleccionada.";
    });

    async function subirFoto(archivo) {
      const datos = new FormData();
      datos.append("file", archivo);
      datos.append("upload_preset", UPLOAD_PRESET);

      const respuesta = await fetch(
        `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
        { method: "POST", body: datos }
      );

      const resultado = await respuesta.json();

      if (!respuesta.ok) {
        throw new Error(resultado.error?.message || "No se pudo subir la foto.");
      }

      return resultado.secure_url;
    }

    $("guardar").addEventListener("click", async () => {
      const nombre = $("nombre").value.trim();
      const categoria = $("categoria").value.trim();
      const descripcion = $("descripcion").value.trim();
      const archivo = $("foto").files[0];

      if (!nombre) {
        $("mensajePanel").textContent = "Escribe el nombre del producto.";
        return;
      }

      $("guardar").disabled = true;
      $("mensajePanel").textContent = "Guardando producto...";

      try {
        if (archivo) {
          imagenActual = await subirFoto(archivo);
        }

        if (!imagenActual) {
          $("mensajePanel").textContent = "Selecciona una foto para el producto.";
          return;
        }

        const datos = {
          nombre,
          categoria,
          descripcion,
          imagen: imagenActual,
          activo: true
        };

        if (productoEditando) {
          await updateDoc(doc(db, "productos", productoEditando), datos);
          $("mensajePanel").textContent = "¡Producto actualizado!";
        } else {
          datos.creado = serverTimestamp();
          await addDoc(collection(db, "productos"), datos);
          $("mensajePanel").textContent = "¡Producto agregado!";
        }

        limpiarFormulario();
        await cargarProductos();

      } catch (error) {
        $("mensajePanel").textContent = "Error: " + error.message;
      } finally {
        $("guardar").disabled = false;
      }
    });

    function limpiarFormulario() {
      $("nombre").value = "";
      $("categoria").value = "";
      $("descripcion").value = "";
      $("foto").value = "";
      $("vistaPrevia").style.display = "none";
      $("estadoFoto").textContent = "";
      imagenActual = "";
      productoEditando = null;
      $("tituloFormulario").textContent = "Agregar producto";
      $("guardar").textContent = "Guardar producto";
      $("cancelar").classList.add("oculto");
    }

    $("cancelar").addEventListener("click", limpiarFormulario);

    async function cargarProductos() {
      $("lista").innerHTML = "Cargando productos...";

      try {
        const consulta = await getDocs(collection(db, "productos"));
        $("lista").innerHTML = "";

        if (consulta.empty) {
          $("lista").textContent = "Todavía no has agregado productos.";
          return;
        }

        consulta.forEach(documento => {
          const p = documento.data();
          const id = documento.id;

          const tarjeta = document.createElement("div");
          tarjeta.className = "producto";

          const imagen = document.createElement("img");
          imagen.src = p.imagen || "";
          imagen.alt = p.nombre || "Producto";

          const info = document.createElement("div");
          info.className = "producto-info";

          const nombre = document.createElement("strong");
          nombre.textContent = p.nombre || "Sin nombre";

          const detalle = document.createElement("p");
          detalle.textContent = p.categoria || "";

          const editar = document.createElement("button");
          editar.textContent = "Editar";
          editar.addEventListener("click", () => {
            productoEditando = id;
            $("nombre").value = p.nombre || "";
            $("categoria").value = p.categoria || "";
            $("descripcion").value = p.descripcion || "";
            imagenActual = p.imagen || "";
            $("tituloFormulario").textContent = "Editar producto";
            $("guardar").textContent = "Actualizar producto";
            $("cancelar").classList.remove("oculto");
            $("vistaPrevia").src = imagenActual;
            $("vistaPrevia").style.display = imagenActual ? "block" : "none";
            window.scrollTo({ top: 0, behavior: "smooth" });
          });

          const eliminar = document.createElement("button");
          eliminar.textContent = "Eliminar";
          eliminar.className = "eliminar";
          eliminar.addEventListener("click", async () => {
            if (!confirm("¿Seguro que quieres eliminar este producto?")) return;
            try {
              await deleteDoc(doc(db, "productos", id));
              await cargarProductos();
            } catch (error) {
              alert("No se pudo eliminar: " + error.message);
            }
          });

          info.append(nombre, detalle, editar, eliminar);
          tarjeta.append(imagen, info);
          $("lista").append(tarjeta);
        });
      } catch (error) {
        $("lista").textContent = "No se pudieron cargar los productos: " + error.message;
      }
    }
  </script>
</body>
</html>
