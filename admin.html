
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administración JANIACRIL</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;font-family:Arial,sans-serif;background:#f2f7f3;color:#26382d}
main{max-width:850px;margin:20px auto;background:white;padding:24px;border-radius:15px}
h1,h2{color:#287449}
input,textarea,select,button{width:100%;padding:12px;margin:7px 0;border-radius:8px;font-size:15px}
input,textarea,select{border:1px solid #ccd8ce;background:white}
button{border:0;background:#287449;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.sec{background:#68796e}
.del{background:#b83b3b}
.card{border:1px solid #dce7df;border-radius:10px;padding:13px;margin:10px 0}
.card img{width:85px;height:85px;object-fit:cover;border-radius:8px}
.item{display:flex;align-items:center;gap:12px}
.item-info{flex:1;min-width:0}
.small{font-size:13px;color:#64766a}
.hidden{display:none}
hr{border:0;border-top:1px solid #e1e9e3;margin:25px 0}
</style>
</head>
<body>
<main>
<h1>JANIACRIL</h1>
<p>Panel de administración</p>

<section id="login">
<h2>Iniciar sesión</h2>
<input id="correo" type="email" placeholder="Correo electrónico">
<input id="clave" type="password" placeholder="Contraseña">
<button id="entrar">Ingresar</button>
<p id="mensaje"></p>
</section>

<section id="panel" class="hidden">
<button id="salir" class="sec">Cerrar sesión</button>

<h2>1. Crear categoría</h2>
<input id="nuevaCategoria" placeholder="Ej: Pastelería y heladería">
<button id="crearCategoria">Crear categoría</button>
<div id="listaCategorias"></div>

<hr>

<h2>2. Crear subcategoría</h2>
<label>Selecciona la categoría principal:</label>
<select id="categoriaSub">
<option value="">Selecciona una categoría</option>
</select>
<input id="nuevaSubcategoria" placeholder="Ej: Porta tortas">
<button id="crearSubcategoria">Crear subcategoría</button>
<div id="listaSubcategorias"></div>

<hr>

<h2>3. Agregar producto</h2>
<input id="nombre" placeholder="Nombre del producto">
<textarea id="descripcion" placeholder="Descripción del producto"></textarea>

<label>Categoría:</label>
<select id="categoriaProducto">
<option value="">Selecciona una categoría</option>
</select>

<label>Subcategoría:</label>
<select id="subcategoriaProducto">
<option value="">Primero selecciona una categoría</option>
</select>

<label>Foto del producto:</label>
<input id="foto" type="file" accept="image/png,image/jpeg,image/webp">
<p id="estadoFoto" class="small"></p>
<img id="preview" class="hidden" style="max-width:150px;border-radius:8px">

<button id="guardarProducto">Guardar producto</button>
<button id="cancelarEdicion" class="sec hidden">Cancelar edición</button>
<p id="mensajeProducto"></p>

<hr>

<h2>4. Productos publicados</h2>
<div id="listaProductos"></div>
</section>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
getFirestore,collection,addDoc,getDocs,updateDoc,deleteDoc,doc,serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyBGDx598ENGfbUADWOXsdmXe42n1Lf-24",
authDomain:"janiacril-50a9b.firebaseapp.com",
projectId:"janiacril-50a9b",
storageBucket:"janiacril-50a9b.firebasestorage.app",
messagingSenderId:"213743116298",
appId:"1:213743116298:web:b3d2055fc470edb55c3ff3",
measurementId:"G-F5VLPGVRQF"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const ADMIN_UID="4vCpe7JpzdM6GqP7V1hpcBK530d2";
const CLOUD_NAME="llxnor52";
const UPLOAD_PRESET="janiacril_productos";

const $=id=>document.getElementById(id);
let categorias=[];
let productos=[];
let imagenActual="";
let editandoProducto=null;

$("entrar").onclick=async()=>{
$("mensaje").textContent="Ingresando...";
try{
await signInWithEmailAndPassword(auth,$("correo").value.trim(),$("clave").value);
}catch(e){$("mensaje").textContent="No se pudo ingresar. Revisa tu correo y contraseña.";}
};

$("salir").onclick=()=>signOut(auth);

onAuthStateChanged(auth,async user=>{
if(user && user.uid===ADMIN_UID){
$("login").classList.add("hidden");
$("panel").classList.remove("hidden");
await actualizarTodo();
}else{
$("panel").classList.add("hidden");
$("login").classList.remove("hidden");
if(user){
$("mensaje").textContent="Esta cuenta no tiene permiso de administración.";
await signOut(auth);
}
}
});

async function actualizarTodo(){
await cargarCategorias();
await cargarProductos();
}

async function cargarCategorias(){
const snap=await getDocs(collection(db,"categorias"));
categorias=snap.docs.map(d=>({id:d.id,...d.data()}));
mostrarCategorias();
}

function mostrarCategorias(){
const principales=categorias.filter(c=>!c.parentId);
const subs=categorias.filter(c=>c.parentId);

$("listaCategorias").innerHTML="";
$("categoriaSub").innerHTML='<option value="">Selecciona una categoría</option>';
$("categoriaProducto").innerHTML='<option value="">Selecciona una categoría</option>';

principales.forEach(c=>{
const op1=new Option(c.nombre,c.id);
const op2=new Option(c.nombre,c.id);
$("categoriaSub").add(op1);
$("categoriaProducto").add(op2);

const div=document.createElement("div");
div.className="card";
const titulo=document.createElement("strong");
titulo.textContent=c.nombre;
const editar=document.createElement("button");
editar.className="sec";
editar.textContent="Cambiar nombre";
editar.onclick=()=>editarCategoria(c.id,c.nombre);
const eliminar=document.createElement("button");
eliminar.className="del";
eliminar.textContent="Eliminar categoría";
eliminar.onclick=()=>eliminarCategoria(c.id,c.nombre);
div.append(titulo,editar,eliminar);
$("listaCategorias").append(div);
});

$("listaSubcategorias").innerHTML="";
subs.forEach(s=>{
const padre=principales.find(c=>c.id===s.parentId);
const div=document.createElement("div");
div.className="card";
const titulo=document.createElement("strong");
titulo.textContent=(padre?padre.nombre:"Categoría") + " → " + s.nombre;
const editar=document.createElement("button");
editar.className="sec";
editar.textContent="Cambiar nombre";
editar.onclick=()=>editarCategoria(s.id,s.nombre);
const eliminar=document.createElement("button");
eliminar.className="del";
eliminar.textContent="Eliminar subcategoría";
eliminar.onclick=()=>eliminarCategoria(s.id,s.nombre);
div.append(titulo,editar,eliminar);
$("listaSubcategorias").append(div);
});

actualizarSubproductos();
}

$("categoriaProducto").onchange=actualizarSubproductos;

function actualizarSubproductos(){
const id=$("categoriaProducto").value;
$("subcategoriaProducto").innerHTML='<option value="">Sin subcategoría</option>';
categorias.filter(c=>c.parentId===id).forEach(c=>{
$("subcategoriaProducto").add(new Option(c.nombre,c.id));
});
}

$("crearCategoria").onclick=async()=>{
const nombre=$("nuevaCategoria").value.trim();
if(!nombre)return alert("Escribe el nombre de la categoría.");
try{
await addDoc(collection(db,"categorias"),{nombre,parentId:null,creado:serverTimestamp()});
$("nuevaCategoria").value="";
await cargarCategorias();
}catch(e){alert("Error al crear: "+e.message);}
};

$("crearSubcategoria").onclick=async()=>{
const parentId=$("categoriaSub").value;
const nombre=$("nuevaSubcategoria").value.trim();
if(!parentId)return alert("Selecciona una categoría principal.");
if(!nombre)return alert("Escribe el nombre de la subcategoría.");
try{
await addDoc(collection(db,"categorias"),{nombre,parentId,creado:serverTimestamp()});
$("nuevaSubcategoria").value="";
await cargarCategorias();
}catch(e){alert("Error al crear: "+e.message);}
};

async function editarCategoria(id,nombreActual){
const nuevo=prompt("Escribe el nuevo nombre:",nombreActual);
if(!nuevo || !nuevo.trim())return;
try{
await updateDoc(doc(db,"categorias",id),{nombre:nuevo.trim()});
await cargarCategorias();
}catch(e){alert("Error al cambiar: "+e.message);}
}

async function eliminarCategoria(id,nombre){
if(!confirm("¿Eliminar "+nombre+"? Los productos relacionados no se borrarán, pero podrían quedar sin categoría."))return;
try{
const tieneHijas=categorias.some(c=>c.parentId===id);
if(tieneHijas){
alert("Primero elimina las subcategorías de esta categoría.");
return;
}
await deleteDoc(doc(db,"categorias",id));
await cargarCategorias();
}catch(e){alert("Error al eliminar: "+e.message);}
}

$("foto").onchange=()=>{
const archivo=$("foto").files[0];
if(!archivo)return;
if(archivo.size>5*1024*1024){
alert("La imagen debe pesar menos de 5 MB.");
$("foto").value="";
return;
}
$("preview").src=URL.createObjectURL(archivo);
$("preview").classList.remove("hidden");
$("estadoFoto").textContent="Imagen seleccionada.";
};

async function subirFoto(archivo){
const datos=new FormData();
datos.append("file",archivo);
datos.append("upload_preset",UPLOAD_PRESET);
const respuesta=await fetch(
`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
{method:"POST",body:datos}
);
const resultado=await respuesta.json();
if(!respuesta.ok)throw new Error(resultado.error?.message||"Error al subir imagen.");
return resultado.secure_url;
}

$("guardarProducto").onclick=async()=>{
const nombre=$("nombre").value.trim();
const descripcion=$("descripcion").value.trim();
const categoriaId=$("categoriaProducto").value;
const subcategoriaId=$("subcategoriaProducto").value;
const categoria=categorias.find(c=>c.id===categoriaId);
const subcategoria=categorias.find(c=>c.id===subcategoriaId);
const archivo=$("foto").files[0];

if(!nombre)return alert("Escribe el nombre del producto.");
if(!categoria)return alert("Selecciona una categoría.");

$("guardarProducto").disabled=true;
$("mensajeProducto").textContent="Guardando...";

try{
if(archivo)imagenActual=await subirFoto(archivo);
if(!imagenActual)throw new Error("Selecciona una foto del producto.");

const datos={
nombre,descripcion,
categoriaId,
categoria:categoria.nombre,
subcategoriaId:subcategoriaId||"",
subcategoria:subcategoria?subcategoria.nombre:"",
imagen:imagenActual,
activo:true
};

if(editandoProducto){
await updateDoc(doc(db,"productos",editandoProducto),datos);
}else{
datos.creado=serverTimestamp();
await addDoc(collection(db,"productos"),datos);
}

$("mensajeProducto").textContent="¡Producto guardado!";
limpiarProducto();
await cargarProductos();
}catch(e){
$("mensajeProducto").textContent="Error: "+e.message;
}finally{
$("guardarProducto").disabled=false;
}
};

function limpiarProducto(){
$("nombre").value="";
$("descripcion").value="";
$("categoriaProducto").value="";
actualizarSubproductos();
$("foto").value="";
$("preview").classList.add("hidden");
$("estadoFoto").textContent="";
imagenActual="";
editandoProducto=null;
$("guardarProducto").textContent="Guardar producto";
$("cancelarEdicion").classList.add("hidden");
}

$("cancelarEdicion").onclick=limpiarProducto;

async function cargarProductos(){
const snap=await getDocs(collection(db,"productos"));
productos=snap.docs.map(d=>({id:d.id,...d.data()}));
$("listaProductos").innerHTML="";
if(!productos.length){
$("listaProductos").textContent="Todavía no hay productos.";
return;
}

productos.forEach(p=>{
const div=document.createElement("div");
div.className="card item";
const img=document.createElement("img");
img.src=p.imagen||"";
const info=document.createElement("div");
info.className="item-info";
const nombre=document.createElement("strong");
nombre.textContent=p.nombre||"Producto";
const detalle=document.createElement("p");
detalle.className="small";
detalle.textContent=(p.categoria||"Sin categoría")+
(p.subcategoria?" → "+p.subcategoria:"");
const editar=document.createElement("button");
editar.className="sec";
editar.textContent="Editar";
editar.onclick=()=>editarProducto(p);
const borrar=document.createElement("button");
borrar.className="del";
borrar.textContent="Eliminar";
borrar.onclick=async()=>{
if(!confirm("¿Eliminar este producto?"))return;
try{
await deleteDoc(doc(db,"productos",p.id));
await cargarProductos();
}catch(e){alert("No se pudo eliminar: "+e.message);}
};
info.append(nombre,detalle,editar,borrar);
div.append(img,info);
$("listaProductos").append(div);
});
}

function editarProducto(p){
editandoProducto=p.id;
$("nombre").value=p.nombre||"";
$("descripcion").value=p.descripcion||"";
$("categoriaProducto").value=p.categoriaId||"";
actualizarSubproductos();
$("subcategoriaProducto").value=p.subcategoriaId||"";
imagenActual=p.imagen||"";
if(imagenActual){
$("preview").src=imagenActual;
$("preview").classList.remove("hidden");
}
$("guardarProducto").textContent="Actualizar producto";
$("cancelarEdicion").classList.remove("hidden");
window.scrollTo({top:0,behavior:"smooth"});
}
</script>
</body>
</html>
